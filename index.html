
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnects for critical third-party resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://gkwzodsznrnbfafaqbtu.supabase.co" crossorigin>
    
    <!-- Preconnects for YouTube embeds -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" crossorigin>
    <link rel="preconnect" href="https://i.ytimg.com" crossorigin>
    
    <link rel="dns-prefetch" href="https://www.youtube.com">
    
    <!-- Preload critical hero image with high priority (WebP for modern browsers) -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero-image.webp"
      type="image/webp"
      fetchpriority="high"
    >
    
    <!-- Font preloads for critical fonts - subsetted to latin only with reduced weights -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap&subset=latin&text=ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789%20%C3%A0%C3%A2%C3%A7%C3%A8%C3%A9%C3%AA%C3%AB%C3%AE%C3%AF%C3%B4%C3%B9%C3%BB%C3%BC%C5%93%C3%80%C3%82%C3%87%C3%88%C3%89%C3%8A%C3%8B%C3%8E%C3%8F%C3%94%C3%99%C3%9B%C3%9C%C5%92.,!?'%22-:;()%26%C2%AB%C2%BB%E2%80%93%E2%80%94" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap&subset=latin" rel="stylesheet"></noscript>
    
    <!-- (hero-poster preload removed: not the LCP element; competed with hero-image.webp) -->
    
    <!--
      Per-route <title>, <meta name="description">, <link rel="canonical">
      and hreflangs are emitted at build time by each page's <SEOHead> via
      vite-react-ssg + react-helmet-async. Keeping them here would
      double-render and let the browser pick the wrong (static) value.
    -->
    <meta name="author" content="Antony Addy" />


    
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Critical CSS -->
    <style>
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; top: 0 !important; }
      .hero-section { min-height: auto; }
      .header { min-height: 64px; }
      h1,h2,h3,h4,h5,h6 { font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b245b">
    <meta name="color-scheme" content="light dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Antony Addy">
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/lovable-uploads/d29db9de-3e6a-459a-9275-77f27b988947.png">
    
    <!-- Service Worker Registration with cache-busting -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Cache-bust: append version to bypass HTTP caching on any host
          navigator.serviceWorker.register('/sw.js?v=2.1.2')
            .then(reg => console.log('Service Worker registered', reg))
            .catch(err => console.error('Service Worker registration failed', err));
        });
      }
    </script>

    <!--
      Per-route Open Graph / Twitter Card tags are emitted by <SEOHead>
      at build time via Helmet. Keep this section empty to avoid
      duplicates that would override the per-route values.
    -->

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
