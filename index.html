
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Self-hosted fonts (latin subset, WOFF2) so no visitor IP reaches Google
         (GDPR). @font-face rules live in the critical <style> below. Inter (body)
         and Bricolage Grotesque (headings) are above the fold on every page. -->
    <link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/bricolage-grotesque-latin-opsz-wght.woff2" as="font" type="font/woff2" crossorigin>
    
    <!--
      Per-route <title>, <meta name="description">, <link rel="canonical">
      and hreflangs are emitted at build time by each page's <SEOHead> via
      vite-react-ssg + react-helmet-async. Keeping them here would
      double-render and let the browser pick the wrong (static) value.
    -->
    <meta name="author" content="Antony Addy" />


    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Progressive-enhancement hook: mark that JS is running BEFORE first paint.
         Scroll-reveal styles are scoped to `html.js`, so with JS disabled or
         still loading, all content renders fully visible (SSG/no-JS safe). -->
    <script>document.documentElement.classList.add('js');</script>

    <!-- Critical CSS -->
    <style>
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(/fonts/inter-latin-wght.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Bricolage Grotesque'; font-style: normal; font-weight: 600 800; font-display: swap; src: url(/fonts/bricolage-grotesque-latin-opsz-wght.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 500; font-display: swap; src: url(/fonts/poppins-latin-500.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 600; font-display: swap; src: url(/fonts/poppins-latin-600.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      @font-face { font-family: 'Poppins'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/poppins-latin-700.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; top: 0 !important; }
      .hero-section { min-height: auto; }
      .header { min-height: 64px; }
      h1,h2,h3,h4,h5,h6 { font-family: 'Bricolage Grotesque', 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; letter-spacing: -0.02em; }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b245b">
    <!-- Light only: the site has no dark theme, so declaring "light dark" made
         browsers in dark mode draw native controls dark on a light page
         (e.g. the contact form's unchecked radios looked selected). -->
    <meta name="color-scheme" content="light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Antony Addy">
    
    <!-- iOS Splash Screens -->
    <link rel="apple-touch-startup-image" href="/lovable-uploads/d29db9de-3e6a-459a-9275-77f27b988947.png">
    
    <!-- Service Worker Registration with cache-busting -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Cache-bust: append version to bypass HTTP caching on any host
          navigator.serviceWorker.register('/sw.js?v=2.2.0')
            .catch(err => console.error('Service Worker registration failed', err));
        });
      }
    </script>

    <!--
      Per-route Open Graph / Twitter Card tags are emitted by <SEOHead>
      at build time via Helmet. Keep this section empty to avoid
      duplicates that would override the per-route values.
    -->

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
