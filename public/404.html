<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light" />
    <title>Page introuvable — 404 | Antony Addy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Served by Vercel for any unknown path. Kept dependency-free, but in the
         site's own palette and fonts so a mistyped link still feels like the
         same site, and it points to all three activities, not just English. -->
    <style>
      @font-face { font-family:'Inter'; font-weight:400 700; font-display:swap; src:url(/fonts/inter-latin-wght.woff2) format('woff2'); }
      @font-face { font-family:'Bricolage Grotesque'; font-weight:600 800; font-display:swap; src:url(/fonts/bricolage-grotesque-latin-opsz-wght.woff2) format('woff2'); }
      :root { --ink:#111731; --muted:#4d5470; --accent:#C8352A; --line:#e3ddd3; --bg:#faf8f5; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
             font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding:1.5rem; }
      .card { max-width:36rem; text-align:center; }
      .logo { display:block; width:120px; height:auto; margin:0 auto 2rem; }
      .code { font-family:'Bricolage Grotesque',sans-serif; font-size:4.5rem; font-weight:800; color:var(--accent); line-height:1; margin:0 0 .5rem; }
      h1 { font-family:'Bricolage Grotesque',sans-serif; font-size:1.6rem; margin:0 0 .75rem; letter-spacing:-.02em; }
      p { color:var(--muted); font-size:1rem; line-height:1.6; margin:0 auto 1.75rem; max-width:28rem; }
      .actions { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; }
      a.btn { display:inline-block; padding:.7rem 1.1rem; border-radius:.75rem; text-decoration:none; font-weight:600;
              font-size:.95rem; border:1px solid var(--line); color:var(--ink); background:#fff; transition:border-color .15s; }
      a.btn:hover, a.btn:focus-visible { border-color:var(--ink); }
      a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
      a.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    </style>
  </head>
  <body>
    <main class="card">
      <a href="/" aria-label="Antony Addy — accueil"><img class="logo" src="/brand/antony-addy-logo.svg" alt="Antony Addy" width="120" height="61" /></a>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page introuvable</h1>
      <p>Cette page n'existe pas ou a été déplacée. Choisissez l'une des options ci-dessous pour continuer.</p>
      <div class="actions">
        <a class="btn primary" href="/contact">Me contacter</a>
        <a class="btn" href="/">Accueil</a>
        <a class="btn" href="/offres-de-formation">Formations d'anglais</a>
        <a class="btn" href="/ia">Formations IA</a>
        <a class="btn" href="/sites-web">Sites web</a>
      </div>
    </main>
  </body>
</html>
