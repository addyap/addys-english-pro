name: Build Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Weekly run to catch external-link rot — a third party removing a page
  # between PRs. The external-link check only fails on a definitive 404/410,
  # so a scheduled red build is a genuine dead link, not runner flakiness.
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest

    # The default token for pull_request events is read-only. Grant write on
    # pull-requests so the audit-diff step below can post/update a sticky
    # comment. Fork PRs still get a read-only token from GitHub — that step
    # tolerates the resulting 403 rather than failing the whole build.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🧰 Set up Node.js
        uses: actions/setup-node@v3
        with:
          # 22+ strips TypeScript types natively, which the prebuild sitemap
          # script needs to import src/data/grammarBlogPosts.ts. Node 20 cannot
          # load a .ts file and fails the build before it starts.
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🔎 Type check
        run: npx tsc --noEmit

      - name: 🧹 Lint
        run: npx eslint .

      - name: 🛠️ Build website
        run: npm run build

      # Unified site audit: internal links resolve, generated content is wired
      # to a page, public/ assets are referenced, and every prerendered HTML
      # in dist/ carries a title/description/canonical/H1. Runs after build so
      # the indexability sub-audit can walk the freshly prerendered output;
      # writes audit-report.json for downstream annotation.
      - name: 🧭 Site audit (links, wiring, assets, indexability)
        run: npm run audit

      # Every run — push, PR, cron — uploads its audit report. The next PR
      # will download main's most-recent successful upload as its baseline;
      # without this step there is nothing to diff against.
      - name: 📤 Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json
          retention-days: 30

      # PR-only: pull the baseline audit report from main's most recent
      # successful run, diff, and post/update a sticky comment on the PR.
      # `gh` is preinstalled and authenticated via GITHUB_TOKEN.
      - name: 📥 Fetch baseline audit report from main
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p base-audit
          # Grab the most recent successful main run of THIS workflow. `|| true`
          # keeps the step green when no baseline exists yet (first PR after
          # this rolls out); the diff step handles a missing baseline itself.
          RUN_ID=$(gh run list \
            --workflow "${{ github.workflow }}" \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId' || true)
          if [ -n "$RUN_ID" ]; then
            echo "Baseline run: $RUN_ID"
            gh run download "$RUN_ID" --name audit-report --dir base-audit || true
          else
            echo "No successful main run found — first-run mode."
          fi

      - name: 💬 Post audit diff comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE_PATH="base-audit/audit-report.json"
          [ ! -f "$BASE_PATH" ] && BASE_PATH="/dev/null"
          CTX="commit \`${{ github.event.pull_request.head.sha }}\` · run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          node scripts/audit/diff.mjs "$BASE_PATH" audit-report.json --context "$CTX" > /tmp/audit-comment.md

          # Sticky comment: find one carrying our marker and edit it, else
          # create a new one. Fork PRs whose token can't post will 403 here —
          # we swallow the error so an unrelated permissions issue doesn't
          # fail the build.
          MARKER='<!-- audit-diff:v1 -->'
          PR="${{ github.event.pull_request.number }}"
          REPO="${{ github.repository }}"
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | contains(\"$MARKER\"))][0].id" || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" \
              -f body="$(cat /tmp/audit-comment.md)" || echo "comment update failed (permissions?)"
          else
            gh pr comment "$PR" --body-file /tmp/audit-comment.md \
              || echo "comment create failed (permissions?)"
          fi

      - name: 🔗 Install Playwright for link validation
        run: npx playwright install chromium

      # Crawls the real build over HTTP and fails on 4xx/5xx. Served by
      # scripts/serve-dist.mjs, which applies vercel.json's redirects and
      # cleanUrls and honours 404s. Deliberately NOT `npm run preview`: vite's
      # SPA fallback answers 200 for every path, so a route that was never
      # prerendered would look healthy and this gate would miss it.
      - name: 🔍 Validate internal links
        run: |
          # Serve dist/ with Vercel's routing semantics, 404s included
          node scripts/serve-dist.mjs &
          SERVER_PID=$!

          # Poll for readiness rather than guessing at a fixed sleep. This step
          # blocks the merge, so it must fail on a broken link and not because
          # a slow runner had not finished booting the server.
          # `if` keeps a failing curl from tripping `bash -e`.
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:4173/; then break; fi
            sleep 1
          done

          # Run link checker
          PW_BASE_URL=http://localhost:4173 node scripts/check-links.mjs

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true

      # The layer the two checks above skip by design: they never leave the
      # origin, so a link to a retired anglaisadistance.fr / afpa.fr page ships
      # unnoticed (which is exactly what happened, repeatedly). This crawls
      # every off-site URL in the build + the off-site redirect destinations in
      # vercel.json and fails ONLY on a definitive 404/410. Anti-bot statuses
      # (403/999) and transient errors (5xx/timeout) are reported, never failed.
      - name: 🌐 Check external links for 404s
        run: node scripts/check-external-links.mjs

